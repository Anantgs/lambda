<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Serverless Order Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .architecture {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
            font-size: 0.9em;
            color: #555;
            text-align: center;
            font-family: monospace;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .items-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .item {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .item-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s ease;
        }

        .remove-btn:hover {
            background: #ff5252;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: #38a169;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .response {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .response.active {
            display: block;
        }

        .response.success {
            background: #f0fff4;
            border-left-color: #48bb78;
        }

        .response.error {
            background: #fff5f5;
            border-left-color: #ff6b6b;
        }

        .response h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .response-item {
            margin: 8px 0;
            color: #555;
            font-family: monospace;
            word-break: break-all;
        }

        .response-label {
            font-weight: 600;
            color: #333;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            border: 4px solid #eee;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .warning {
            background: #fff5e6;
            border-left: 4px solid #ff9800;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #e65100;
        }

        .success-icon {
            color: #48bb78;
        }

        .error-icon {
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .item-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Order Application</h1>
            <p class="subtitle">AWS Serverless Architecture Demo</p>
        </header>

        <div class="architecture">
            Python App → API Gateway → Lambda → DynamoDB
        </div>

        {% if not api_configured %}
        <div class="warning">
            ⚠️ <strong>API Gateway endpoint not configured</strong><br>
            Please update your <code>.env</code> file with your API Gateway URL
        </div>
        {% endif %}

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('place-order')">📦 Place Order</button>
            <button class="tab-btn" onclick="switchTab('check-status')">📋 Check Status</button>
        </div>

        <!-- Place Order Tab -->
        <div id="place-order" class="tab-content active">
            <form onsubmit="placeOrder(event)">
                <div class="form-group">
                    <label for="email">📧 Customer Email</label>
                    <input type="email" id="email" name="email" value="customer@example.com" required>
                </div>

                <div class="form-group">
                    <label for="payment">💳 Payment Method</label>
                    <select id="payment" name="payment" required>
                        <option value="card">Credit Card</option>
                        <option value="bank">Bank Transfer</option>
                        <option value="paypal">PayPal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📦 Order Items</label>
                    <div class="items-section" id="items-container">
                        <div class="item">
                            <div class="item-row">
                                <div>
                                    <label style="margin-bottom: 5px;">Product ID</label>
                                    <input type="text" class="product-id" value="PROD-001" required>
                                </div>
                                <div>
                                    <label style="margin-bottom: 5px;">Quantity</label>
                                    <input type="number" class="quantity" value="1" min="1" required>
                                </div>
                                <div>
                                    <label style="margin-bottom: 5px;">Price</label>
                                    <input type="number" class="price" value="29.99" min="0" step="0.01" required>
                                </div>
                                <button type="button" class="remove-btn btn-small" onclick="removeItem(this)">Remove</button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary" onclick="addItem()">+ Add Item</button>
                </div>

                <button type="submit" class="btn btn-primary">Place Order</button>
            </form>

            <div class="loading" id="place-loading">
                <div class="spinner"></div>
                <p>Placing order...</p>
            </div>

            <div class="response" id="place-response"></div>
        </div>

        <!-- Check Status Tab -->
        <div id="check-status" class="tab-content">
            <form onsubmit="checkStatus(event)">
                <div class="form-group">
                    <label for="order-id">📝 Order ID</label>
                    <input type="text" id="order-id" placeholder="e.g., ORD-123456" required>
                </div>
                <button type="submit" class="btn btn-primary">Check Status</button>
            </form>

            <div class="loading" id="status-loading">
                <div class="spinner"></div>
                <p>Checking status...</p>
            </div>

            <div class="response" id="status-response"></div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function addItem() {
            const container = document.getElementById('items-container');
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `
                <div class="item-row">
                    <div>
                        <label style="margin-bottom: 5px;">Product ID</label>
                        <input type="text" class="product-id" placeholder="PROD-002" required>
                    </div>
                    <div>
                        <label style="margin-bottom: 5px;">Quantity</label>
                        <input type="number" class="quantity" value="1" min="1" required>
                    </div>
                    <div>
                        <label style="margin-bottom: 5px;">Price</label>
                        <input type="number" class="price" value="0" min="0" step="0.01" required>
                    </div>
                    <button type="button" class="remove-btn btn-small" onclick="removeItem(this)">Remove</button>
                </div>
            `;
            container.appendChild(item);
        }

        function removeItem(btn) {
            btn.closest('.item').remove();
        }

        function getOrderData() {
            const items = [];
            document.querySelectorAll('#items-container .item').forEach(item => {
                items.push({
                    productId: item.querySelector('.product-id').value,
                    qty: parseInt(item.querySelector('.quantity').value),
                    price: parseFloat(item.querySelector('.price').value)
                });
            });

            return {
                items: items,
                paymentMethod: document.getElementById('payment').value,
                customerEmail: document.getElementById('email').value
            };
        }

        function displayResponse(elementId, title, data, isError = false) {
            const responseDiv = document.getElementById(elementId);
            let html = `<h3>${isError ? '❌' : '✅'} ${title}</h3>`;

            if (typeof data === 'object') {
                for (const [key, value] of Object.entries(data)) {
                    html += `<div class="response-item"><span class="response-label">${key}:</span> ${JSON.stringify(value)}</div>`;
                }
            } else {
                html += `<div class="response-item">${data}</div>`;
            }

            responseDiv.innerHTML = html;
            responseDiv.classList.add('active');
            responseDiv.classList.toggle('success', !isError);
            responseDiv.classList.toggle('error', isError);
        }

        async function placeOrder(event) {
            event.preventDefault();

            const loading = document.getElementById('place-loading');
            const response = document.getElementById('place-response');
            const orderData = getOrderData();

            loading.style.display = 'block';
            response.classList.remove('active');

            try {
                const result = await fetch('/api/place-order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                const data = await result.json();

                if (result.ok) {
                    displayResponse('place-response', 'Order Placed Successfully', data, false);
                } else {
                    displayResponse('place-response', 'Error Placing Order', data, true);
                }
            } catch (error) {
                displayResponse('place-response', 'Error Placing Order', error.message, true);
            } finally {
                loading.style.display = 'none';
            }
        }

        async function checkStatus(event) {
            event.preventDefault();

            const orderId = document.getElementById('order-id').value;
            const loading = document.getElementById('status-loading');
            const response = document.getElementById('status-response');

            loading.style.display = 'block';
            response.classList.remove('active');

            try {
                const result = await fetch(`/api/check-order/${orderId}`);
                const data = await result.json();

                if (result.ok) {
                    displayResponse('status-response', 'Order Status', data, false);
                } else {
                    displayResponse('status-response', 'Error Checking Order', data, true);
                }
            } catch (error) {
                displayResponse('status-response', 'Error Checking Order', error.message, true);
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
